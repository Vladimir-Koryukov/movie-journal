spring.application.name=movie-journal
spring.main.banner-mode=off
logging.structured.format.console=ecs

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false

management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.session.jdbc.initialize-schema=never

app.omdb.base-url=${OMDB_BASE_URL:https://www.omdbapi.com}
app.omdb.api-key=${OMDB_API_KEY:}
app.omdb.max-results=${OMDB_MAX_RESULTS:8}
app.omdb.max-cast-members=${OMDB_MAX_CAST_MEMBERS:8}

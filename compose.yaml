name: movie-journal

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: movie-journal-backend:${APP_VERSION:-0.2.0}
  environment:
    DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-movie_journal}
    DB_USERNAME: ${POSTGRES_USER:-movie_journal_app}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    PORT: "8080"
  init: true
  mem_limit: 512m
  stop_grace_period: 40s
  logging: *logging

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_journal}
      POSTGRES_USER: ${POSTGRES_USER:-movie_journal_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 40s
    logging: *logging

  migrate:
    <<: *backend
    # Uses the exact image produced by `docker compose build backend`.
    pull_policy: never
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: movie-journal-frontend:${APP_VERSION:-0.2.0}
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped
    stop_grace_period: 40s
    logging: *logging

volumes:
  postgres-data:

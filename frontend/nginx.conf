user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format json escape=json
        '{"time":"$time_iso8601","method":"$request_method",'
        '"path":"$uri","status":$status,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout json;

    upstream movie_journal_backend {
        zone movie_journal_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server backend:8080 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Do not enable non_idempotent: an already sent POST must not be retried.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        location /api/ {
            proxy_pass http://movie_journal_backend;
        }

        location = /actuator/health {
            proxy_pass http://movie_journal_backend;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: hello-cron
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: hello-cron
        spec:
          restartPolicy: Never
          containers:
            - name: hello
              image: busybox:1.37
              command: ["/bin/sh", "-c"]
              args:
                - |
                  date
                  echo "Hello from CronJob"

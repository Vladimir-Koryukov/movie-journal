apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-demo
spec:
  selector:
    matchLabels:
      app: node-demo
  template:
    metadata:
      labels:
        app: node-demo
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: node-demo
          image: busybox:1.37
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "DaemonSet pod on node: $NODE_NAME"
                sleep 30
              done

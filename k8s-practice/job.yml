apiVersion: batch/v1
kind: Job
metadata:
  name: hello
spec:
  completions: 1
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hello
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              date
              echo "Hello from the Kubernetes cluster"

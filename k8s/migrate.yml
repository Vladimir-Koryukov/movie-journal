apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: movie-journal
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: movie-journal-backend:0.2.0
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
